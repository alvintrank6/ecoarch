<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 390" role="img" aria-label="Hồ sơ bàn giao"><title>Hồ sơ bàn giao</title><rect width="630" height="390" fill="#F7F4EE"/><text x="40" y="44" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#2F2F2F" text-anchor="start">Hồ sơ bàn giao</text><text x="40" y="72" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#5C5C57" text-anchor="start">Ba tài liệu cốt lõi</text><rect x="40" y="100" width="170" height="110" rx="6" fill="#fff" stroke="#4E5E37" stroke-width="2"/><text x="54" y="135" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4E5E37" text-anchor="start">Biên bản khảo sát</text><text x="54" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#5C5C57" text-anchor="start">Ghi lại hiện trạng</text><line x1="125" y1="210" x2="125" y2="250" stroke="#4E5E37" stroke-width="2"/><rect x="230" y="100" width="170" height="110" rx="6" fill="#fff" stroke="#4E5E37" stroke-width="2"/><text x="244" y="135" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4E5E37" text-anchor="start">Bảng giải thích lựa chọn</text><text x="244" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#5C5C57" text-anchor="start">Lựa chọn, lý do, đánh đổi</text><line x1="315" y1="210" x2="315" y2="250" stroke="#4E5E37" stroke-width="2"/><rect x="420" y="100" width="170" height="110" rx="6" fill="#fff" stroke="#4E5E37" stroke-width="2"/><text x="434" y="135" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4E5E37" text-anchor="start">Danh mục bàn giao</text><text x="434" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#5C5C57" text-anchor="start">Liệt kê đầy đủ hồ sơ</text><line x1="505" y1="210" x2="505" y2="250" stroke="#4E5E37" stroke-width="2"/><line x1="125" y1="250" x2="505" y2="250" stroke="#4E5E37" stroke-width="2"/><line x1="315" y1="250" x2="315" y2="275" stroke="#4E5E37" stroke-width="2"/><rect x="40" y="275" width="550" height="90" rx="6" fill="#4E5E37"/><text x="315" y="310" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#F7F4EE" text-anchor="middle">Bản vẽ và hình ảnh theo gói bạn chọn</text><text x="315" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#F7F4EE" text-anchor="middle">Gói 1: 2D · Gói 2: 3D · Gói 3: hoàn chỉnh</text></svg>
